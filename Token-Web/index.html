<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE AuthToken 発行ポータル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --line-neon: #00ff66;
      --bg-base: #06090e;
      --card-bg: rgba(12, 19, 32, 0.85);
      --accent-cyan: #00f0ff;
    }
    * { box-sizing: border-box; font-family: 'Zen Kaku Gothic New', sans-serif; }
    body {
      background: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 100%, rgba(0, 240, 255, 0.1) 0%, transparent 50%);
      display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; color: #f0f6fc;
    }
    .card {
      position: relative; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      width: 100%; max-width: 440px; padding: 40px 32px; border-radius: 20px; border: 1px solid rgba(0, 255, 102, 0.25);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 102, 0.15); text-align: center;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--line-neon), transparent); border-radius: 20px 20px 0 0;
    }
    .brand-title { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #ffffff; margin: 0 0 6px 0; text-shadow: 0 0 10px rgba(0, 255, 102, 0.5); }
    p.desc { color: #8b949e; font-size: 13px; margin: 0 0 28px 0; }
    .field { text-align: left; margin-bottom: 20px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--line-neon); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    input {
      width: 100%; padding: 14px 16px; background: rgba(4, 8, 15, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px; font-size: 15px; color: #ffffff; outline: none; transition: all 0.25s ease;
    }
    input:focus { border-color: var(--line-neon); box-shadow: 0 0 12px rgba(0, 255, 102, 0.3); background: rgba(4, 8, 15, 1); }
    button {
      width: 100%; background: linear-gradient(135deg, #00ff66 0%, #00b347 100%); color: #000000; border: none;
      padding: 16px; font-size: 16px; font-weight: 900; border-radius: 10px; cursor: pointer; margin-top: 10px;
      transition: all 0.2s ease; box-shadow: 0 0 20px rgba(0, 255, 102, 0.3); letter-spacing: 1px;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 255, 102, 0.5); filter: brightness(1.1); }
    button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; box-shadow: none; transform: none; }
    .status-box { margin-top: 24px; padding: 14px 16px; border-radius: 10px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); font-size: 13px; color: #c9d1d9; line-height: 1.5; word-break: break-all; }
    .pincode-box { display: none; margin-top: 24px; background: rgba(0, 255, 102, 0.05); border: 1px solid var(--line-neon); border-radius: 12px; padding: 20px; box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.1); }
    .pincode-title { font-size: 12px; font-weight: 700; color: var(--line-neon); letter-spacing: 1px; }
    .pincode-val { font-family: 'Orbitron', sans-serif; font-size: 44px; font-weight: 900; color: #ffffff; letter-spacing: 12px; margin: 10px 0 0 0; text-shadow: 0 0 20px var(--line-neon); }
    .token-box { display: none; margin-top: 24px; text-align: left; }
    .token-val { background: #010409; color: var(--accent-cyan); padding: 14px; border-radius: 8px; border: 1px solid rgba(0, 240, 255, 0.3); font-family: monospace; font-size: 12px; word-break: break-all; max-height: 120px; overflow-y: auto; box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-title">AUTHTOKEN PORTAL</div>
    <p class="desc">LINE アカウントの認証トークンを発行・同期します</p>

    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="example@gmail.com" autocomplete="off">
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button id="submit-btn" onclick="startLogin()">GENERATE TOKEN</button>

    <div class="status-box" id="msg-text">メールアドレスとパスワードを入力して「GENERATE TOKEN」を押してください。</div>

    <div class="pincode-box" id="pin-area">
      <div class="pincode-title">PIN CODE</div>
      <div class="pincode-val" id="pin-code">----</div>
    </div>

    <div class="token-box" id="token-area">
      <label>SUCCESS AuthToken</label>
      <div class="token-val" id="token-text"></div>
    </div>
  </div>

  <script>
    let isPolling = false;

    async function startLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert('メールアドレスとパスワードを入力してください。');
        return;
      }

      document.getElementById('submit-btn').disabled = true;

      try {
        await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });

        if (!isPolling) {
          isPolling = true;
          pollStatus();
        }
      } catch (e) {
        alert('通信エラーが発生しました。');
        document.getElementById('submit-btn').disabled = false;
      }
    }

    async function pollStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        document.getElementById('msg-text').innerText = data.message;

        if (data.status === 'PIN_REQUIRED' && data.pincode) {
          document.getElementById('pin-area').style.display = 'block';
          document.getElementById('pin-code').innerText = data.pincode;
        }

        if (data.status === 'SUCCESS' && data.token) {
          document.getElementById('pin-area').style.display = 'none';
          document.getElementById('token-area').style.display = 'block';
          document.getElementById('token-text').innerText = data.token;
          document.getElementById('submit-btn').disabled = false;
          isPolling = false;
          return;
        }

        if (data.status === 'ERROR') {
          document.getElementById('submit-btn').disabled = false;
          isPolling = false;
          return;
        }
      } catch (_) {}

      if (isPolling) {
        setTimeout(pollStatus, 1500);
      }
    }
  </script>
</body>
</html>
