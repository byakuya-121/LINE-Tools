<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE-Tools | AuthToken Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --line-neon: #00ff66;
      --bg-base: #06090e;
      --card-bg: rgba(12, 19, 32, 0.88);
      --accent-cyan: #00f0ff;
    }

    * {
      box-sizing: border-box;
      font-family: 'Zen Kaku Gothic New', sans-serif;
    }

    body {
      background: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 100%, rgba(0, 240, 255, 0.1) 0%, transparent 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #f0f6fc;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 100%;
      max-width: 460px;
      padding: 40px 32px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 102, 0.25);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 102, 0.15);
      text-align: center;
      transition: all 0.4s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--line-neon), transparent);
      border-radius: 20px 20px 0 0;
    }

    .view-section {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .hidden {
      display: none !important;
      opacity: 0;
      transform: scale(0.95);
    }

    .hero-badge {
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      color: var(--line-neon);
      border: 1px solid rgba(0, 255, 102, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 2px;
      margin-bottom: 16px;
      background: rgba(0, 255, 102, 0.05);
    }

    .site-preview {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 102, 0.3);
      margin-bottom: 20px;
      background: #02060d;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      margin: 0 0 8px 0;
      text-shadow: 0 0 12px rgba(0, 255, 102, 0.5);
    }

    p.desc {
      color: #8b949e;
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }

    .field {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--line-neon);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(4, 8, 15, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus {
      border-color: var(--line-neon);
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
      background: rgba(4, 8, 15, 1);
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, #00ff66 0%, #00b347 100%);
      color: #000000;
      border: none;
      padding: 16px;
      font-size: 15px;
      font-weight: 900;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
      letter-spacing: 1px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.5);
      filter: brightness(1.1);
    }

    .btn-main:disabled {
      background: #21262d;
      color: #484f58;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #8b949e;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      color: #ffffff;
      border-color: var(--line-neon);
    }

    .status-box {
      margin-top: 24px;
      padding: 14px 16px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      color: #c9d1d9;
      line-height: 1.5;
      word-break: break-all;
    }

    .pincode-box {
      display: none;
      margin-top: 24px;
      background: rgba(0, 255, 102, 0.05);
      border: 1px solid var(--line-neon);
      border-radius: 12px;
      padding: 20px;
      box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.1);
    }

    .pincode-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--line-neon);
      letter-spacing: 1px;
    }

    .pincode-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 44px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 12px;
      margin: 10px 0 0 0;
      text-shadow: 0 0 20px var(--line-neon);
    }

    .token-box {
      display: none;
      margin-top: 24px;
      text-align: left;
    }

    .token-val {
      background: #010409;
      color: var(--accent-cyan);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      max-height: 120px;
      overflow-y: auto;
      box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="card">
    
    <!-- 1. WELCOME SECTION -->
    <div id="welcome-view" class="view-section">
      <div class="hero-badge">SYSTEM OFFICIAL</div>
      
      <!-- ネオンサイバーバナー画像 -->
      <img src="/banner.svg" alt="LINE-Tools Auth Portal Banner" class="site-preview">

      <div class="brand-title">LINE-TOOLS PORTAL</div>
      <p class="desc">
        LINE アカウントの AuthToken を安全に発行・同期し、ボット連携を自動化する管理ポータルサイトです。
      </p>

      <button class="btn-main" onclick="showPortalView()">
        ENTER PORTAL
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </div>

    <!-- 2. AUTH TOKEN FORM SECTION -->
    <div id="portal-view" class="view-section hidden">
      <div style="text-align: left;">
        <button class="btn-secondary" onclick="showWelcomeView()">← HOME</button>
      </div>

      <div class="brand-title">AUTHTOKEN PORTAL</div>
      <p class="desc">LINE のログイン情報を入力して AuthToken を発行します</p>

      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="example@gmail.com" autocomplete="off">
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button id="submit-btn" class="btn-main" onclick="startLogin()">GENERATE TOKEN</button>

      <div class="status-box" id="msg-text">メールアドレスとパスワードを入力して「GENERATE TOKEN」を押してください。</div>

      <div class="pincode-box" id="pin-area">
        <div class="pincode-title">PIN CODE</div>
        <div class="pincode-val" id="pin-code">----</div>
      </div>

      <div class="token-box" id="token-area">
        <label>SUCCESS AuthToken</label>
        <div class="token-val" id="token-text"></div>
      </div>
    </div>

  </div>

  <script>
    let isPolling = false;

    function showPortalView() {
      document.getElementById('welcome-view').classList.add('hidden');
      document.getElementById('portal-view').classList.remove('hidden');
    }

    function showWelcomeView() {
      document.getElementById('portal-view').classList.add('hidden');
      document.getElementById('welcome-view').classList.remove('hidden');
    }

    async function startLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert('メールアドレスとパスワードを入力してください。');
        return;
      }

      document.getElementById('submit-btn').disabled = true;

      try {
        await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });

        if (!isPolling) {
          isPolling = true;
          pollStatus();
        }
      } catch (e) {
        alert('通信エラーが発生しました。');
        document.getElementById('submit-btn').disabled = false;
      }
    }

    async function pollStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        document.getElementById('msg-text').innerText = data.message;

        if (data.status === 'PIN_REQUIRED' && data.pincode) {
          document.getElementById('pin-area').style.display = 'block';
          document.getElementById('pin-code').innerText = data.pincode;
        }

        if (data.status === 'SUCCESS' && data.token) {
          document.getElementById('pin-area').style.display = 'none';
          document.getElementById('token-area').style.display = 'block';
          document.getElementById('token-text').innerText = data.token;
          document.getElementById('submit-btn').disabled = false;
          isPolling = false;
          return;
        }

        if (data.status === 'ERROR') {
          document.getElementById('submit-btn').disabled = false;
          isPolling = false;
          return;
        }
      } catch (_) {}

      if (isPolling) {
        setTimeout(pollStatus, 1500);
      }
    }
  </script>
</body>
</html>
