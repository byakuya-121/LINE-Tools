<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byakuya Tools // Control Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #080B09;
      --panel-bg: #0D110E;
      --panel-dark: #050706;
      --panel-border: rgba(0, 245, 138, 0.25);
      --main-neon: #00F58A;
      --sub-neon: #78FFC0;
      --text-main: #E8F5EC;
      --text-dim: #607367;
      --danger-color: #FF4A4A;
    }
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-base); margin: 0; color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    #welcome-window { width: 100vw; height: 100vh; max-width: 1180px; max-height: 680px; background: var(--bg-base); border: 1px solid var(--panel-border); display: flex; }
    .left-panel { width: 370px; background: var(--panel-dark); border-right: 1px solid var(--main-neon); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
    .title { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 900; color: var(--main-neon); }
    .right-panel { flex: 1; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; }
    .welcome-title { font-size: 36px; font-weight: 800; color: #fff; margin: 0; }
    .btn-start { width: 100%; background: var(--main-neon); color: #000; font-weight: 900; padding: 16px; border: none; cursor: pointer; }
    #dashboard-window { position: fixed; inset: 0; background: var(--bg-base); display: flex; flex-direction: column; z-index: 200; }
    .hidden { display: none !important; }
    header.dash-header { background: var(--panel-bg); border-bottom: 1px solid var(--panel-border); padding: 12px 28px; display: flex; justify-content: space-between; align-items: center; }
    .dash-brand { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 900; color: #fff; }
    .dash-content { flex: 1; padding: 24px; max-width: 1280px; margin: 0 auto; width: 100%; overflow-y: auto; }
    .auth-form-box { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 28px; max-width: 480px; margin: 20px auto; }
    .field { text-align: left; margin-bottom: 16px; }
    label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--main-neon); margin-bottom: 6px; }
    input { width: 100%; padding: 12px; background: var(--panel-dark); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; font-size: 13px; color: #fff; outline: none; }
    .pincode-box { display: none; margin-top: 16px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--main-neon); padding: 16px; text-align: center; }
    .pincode-val { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900; color: #fff; letter-spacing: 8px; }
    .token-box { display: none; margin-top: 16px; }
    .token-val { background: var(--panel-dark); color: var(--sub-neon); padding: 10px; font-family: monospace; font-size: 11px; word-break: break-all; border: 1px solid var(--panel-border); }
    .btn-small { background: rgba(255,255,255,0.05); border: 1px solid var(--main-neon); color: var(--main-neon); padding: 8px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="welcome-window">
    <div class="left-panel">
      <div class="title">BYAKUYA TOOLS</div>
      <div style="font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim);">SYSTEM ONLINE</div>
    </div>
    <div class="right-panel">
      <h1 class="welcome-title">Welcome to Control Portal</h1>
      <button class="btn-start" onclick="launchDashboard()">START BYAKUYA TOOLS</button>
    </div>
  </div>

  <div id="dashboard-window" class="hidden">
    <header class="dash-header">
      <div class="dash-brand">BYAKUYATOOLS // CONTROL CENTER</div>
      <button class="btn-small" style="border-color:var(--danger-color); color:var(--danger-color);" onclick="exitDashboard()">EXIT</button>
    </header>

    <main class="dash-content">
      <div class="auth-form-box">
        <div class="field">
          <label>EMAIL ADDRESS</label>
          <input type="email" id="email" placeholder="example@gmail.com">
        </div>
        <div class="field">
          <label>PASSWORD</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>
        <button id="submit-btn" class="btn-start" onclick="startLogin()">GENERATE TOKEN</button>

        <div style="margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);" id="msg-text">
          ログイン情報を入力して GENERATE TOKEN を押してください。
        </div>

        <div class="pincode-box" id="pin-area">
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--main-neon);">
            PIN CODE (期限: <span id="pin-timer">120</span>s)
          </div>
          <div class="pincode-val" id="pin-code">----</div>
          <button class="btn-small" style="margin-top:8px; border-color:var(--danger-color); color:var(--danger-color);" onclick="cancelLogin()">✕ キャンセル</button>
        </div>

        <div class="token-box" id="token-area">
          <label>SUCCESS AUTHTOKEN</label>
          <div class="token-val" id="token-text"></div>
          <button class="btn-small" style="margin-top:8px; width:100%;" onclick="navigator.clipboard.writeText(document.getElementById('token-text').innerText)">📋 COPY TOKEN</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    function launchDashboard() {
      document.getElementById('welcome-window').classList.add('hidden');
      document.getElementById('dashboard-window').classList.remove('hidden');
    }
    function exitDashboard() {
      document.getElementById('dashboard-window').classList.add('hidden');
      document.getElementById('welcome-window').classList.remove('hidden');
    }

    let isPolling = false;
    let pinTimerInterval = null;
    let countdownSec = 120;

    function cancelLogin() {
      isPolling = false;
      if (pinTimerInterval) clearInterval(pinTimerInterval);
      document.getElementById('pin-area').style.display = 'none';
      document.getElementById('token-area').style.display = 'none';
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('msg-text').innerText = 'ログイン情報を入力して GENERATE TOKEN を押してください。';
    }

    function startPinTimer() {
      if (pinTimerInterval) clearInterval(pinTimerInterval);
      countdownSec = 120;
      document.getElementById('pin-timer').innerText = countdownSec;

      pinTimerInterval = setInterval(() => {
        countdownSec--;
        document.getElementById('pin-timer').innerText = countdownSec;
        if (countdownSec <= 0) {
          cancelLogin();
          document.getElementById('msg-text').innerText = '⏰ PINコードの有効期限が切れました。再度お試しください。';
        }
      }, 1000);
    }

    async function startLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) return alert('メールアドレスとパスワードを入力してください。');

      cancelLogin();
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('msg-text').innerText = 'LINE サーバーへ接続中...';

      try {
        await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        isPolling = true;
        startPinTimer();
        pollStatus();
      } catch (_) {
        alert('通信エラーが発生しました。');
        cancelLogin();
      }
    }

    async function pollStatus() {
      if (!isPolling) return;
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        if (data.message) document.getElementById('msg-text').innerText = data.message;

        if (data.status === 'PIN_REQUIRED' && data.pincode) {
          document.getElementById('pin-area').style.display = 'block';
          document.getElementById('pin-code').innerText = data.pincode;
        }

        if (data.status === 'SUCCESS' && data.token) {
          if (pinTimerInterval) clearInterval(pinTimerInterval);
          document.getElementById('pin-area').style.display = 'none';
          document.getElementById('token-area').style.display = 'block';
          document.getElementById('token-text').innerText = data.token;
          document.getElementById('submit-btn').disabled = false;
          isPolling = false;
          return;
        }

        if (data.status === 'ERROR') {
          cancelLogin();
          document.getElementById('msg-text').innerText = '❌ エラー: ' + (data.message || 'ログインに失敗しました。');
          return;
        }
      } catch (_) {}

      if (isPolling) setTimeout(pollStatus, 1500);
    }
  </script>
</body>
</html>
