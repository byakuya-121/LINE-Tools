<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByakuyaTools // Control Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #080B09;
      --panel-bg: #101612;
      --panel-border: rgba(0, 245, 138, 0.2);
      --main-neon: #00F58A;
      --sub-neon: #78FFC0;
      --text-color: #E8F5EC;
      --text-dim: #607367;
      --danger-color: #ff4a4a;
      --warning-color: #ffb800;
    }

    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-base);
      background-image: 
        linear-gradient(rgba(0, 245, 138, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 245, 138, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      margin: 0;
      padding: 0;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* --- 1. BOOT BOOTSTRAP TERMINAL (起動アニメーション) --- */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-base);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .boot-logo {
      width: 120px;
      height: 120px;
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.8s ease;
      filter: drop-shadow(0 0 15px rgba(0, 245, 138, 0.4));
    }

    .boot-logo.show {
      opacity: 1;
      transform: scale(1);
    }

    .boot-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--text-color);
      margin-top: 16px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .boot-title.show { opacity: 1; }

    .boot-terminal {
      width: 100%;
      max-width: 560px;
      height: 140px;
      margin-top: 24px;
      background: rgba(16, 22, 18, 0.8);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--main-neon);
      overflow-y: auto;
      text-align: left;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--main-neon);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .skip-btn {
      position: absolute;
      bottom: 30px;
      background: transparent;
      border: 1px solid var(--text-dim);
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .skip-btn:hover {
      border-color: var(--main-neon);
      color: var(--main-neon);
    }

    /* --- 2. MAIN LAYOUT & HERO --- */
    #main-content {
      opacity: 0;
      transition: opacity 0.8s ease;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    #main-content.visible { opacity: 1; }

    /* Header Nav */
    header {
      height: 64px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(8, 11, 9, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .brand-header img { width: 28px; height: 28px; }

    .nav-links {
      display: flex;
      gap: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .nav-links a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--main-neon);
    }

    /* Hero Section */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
      position: relative;
    }

    .hero-banner-img {
      width: 100%;
      max-width: 680px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 30px rgba(0, 245, 138, 0.1);
      margin-bottom: 32px;
    }

    .hero-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      margin: 0 0 12px 0;
      text-shadow: 0 0 20px rgba(0, 245, 138, 0.3);
    }

    .hero-desc {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
      font-size: 14px;
      max-width: 520px;
      line-height: 1.6;
      margin: 0 0 32px 0;
    }

    .btn-cyber {
      background: linear-gradient(135deg, var(--main-neon) 0%, #00b365 100%);
      color: #040605;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 14px;
      padding: 16px 36px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(0, 245, 138, 0.3);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-cyber:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(0, 245, 138, 0.6);
      filter: brightness(1.1);
    }

    /* --- 3. FOOTER --- */
    footer {
      border-top: 1px solid var(--panel-border);
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--panel-bg);
    }

    /* Accessibility Support */
    @media (prefers-reduced-motion: reduce) {
      #boot-screen { display: none !important; }
      #main-content { opacity: 1 !important; }
      .cursor { animation: none; }
    }
  </style>
</head>
<body>

  <!-- 1. 起動アニメーション画面 -->
  <div id="boot-screen">
    <!-- SVG Fox Logo (Inline for Smooth Animation) -->
    <svg class="boot-logo" id="boot-logo" viewBox="0 0 100 100">
      <polygon points="50,5 90,30 90,70 50,95 10,70 10,30" fill="#101612" stroke="#00F58A" stroke-width="3"/>
      <polygon points="20,25 32,48 45,40" fill="#00F58A"/>
      <polygon points="80,25 68,48 55,40" fill="#00F58A"/>
      <polygon points="50,40 20,55 32,80 50,90 68,80 80,55" fill="#00F58A"/>
      <polygon points="34,58 44,58 39,64" fill="#080B09"/>
      <polygon points="66,58 56,58 61,64" fill="#080B09"/>
    </svg>
    <div class="boot-title" id="boot-title">BYAKUYATOOLS</div>
    
    <div class="boot-terminal" id="terminal-out"></div>
    <button class="skip-btn" onclick="finishBoot()">[ SKIP INITIALIZATION ]</button>
  </div>

  <!-- 2. メインコンテンツ -->
  <div id="main-content">
    <header>
      <div class="brand-header">
        <img src="/banner.svg" alt="ByakuyaTools Logo">
        <span>BYAKUYATOOLS</span>
      </div>
      <nav class="nav-links">
        <a href="#" class="active">// TERMINAL</a>
        <a href="#">// CONTROL CENTER</a>
        <a href="#">// TOOLS</a>
        <a href="#">// SECURE LINK</a>
      </nav>
    </header>

    <main class="hero">
      <img src="/banner.svg" alt="ByakuyaTools Cyber Banner" class="hero-banner-img">
      <h1 class="hero-title">CONTROL YOUR ENVIRONMENT.</h1>
      <p class="hero-desc">
        A focused control surface for your connected workspace and automated LINE bot security management.
      </p>
      <button class="btn-cyber" onclick="alert('Control Center & Tools は Step 2 で解放されます。')">
        INITIALIZE SYSTEM ➔
      </button>
    </main>

    <footer>
      <div>BYAKUYATOOLS // CONTROL PORTAL</div>
      <div>BUILD 02.4.1</div>
    </footer>
  </div>

  <script>
    const logs = [
      "SYSTEM_INIT: Initializing ByakuyaTools V2 core...",
      "AUTH_MODULE: Checking secure token storage...",
      "NET_CHECK: Establishing encrypted tunnel to Render node...",
      "SECURITY_LAB: Loading local defense matrices...",
      "READY: System initialized successfully."
    ];

    let logIndex = 0;
    const termOut = document.getElementById('terminal-out');
    const hasBooted = sessionStorage.getItem('byakuya_booted');

    function runBootSequence() {
      // 2回目以降のセッションアクセスは高速化
      const delay = hasBooted ? 150 : 400;

      setTimeout(() => document.getElementById('boot-logo').classList.add('show'), 100);
      setTimeout(() => document.getElementById('boot-title').classList.add('show'), 400);

      setTimeout(typeNextLog, 600);
    }

    function typeNextLog() {
      if (logIndex < logs.length) {
        const line = document.createElement('div');
        line.innerText = "> " + logs[logIndex];
        termOut.appendChild(line);
        termOut.scrollTop = termOut.scrollHeight;
        logIndex++;
        setTimeout(typeNextLog, hasBooted ? 100 : 350);
      } else {
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        termOut.appendChild(cursor);
        setTimeout(finishBoot, hasBooted ? 300 : 800);
      }
    }

    function finishBoot() {
      sessionStorage.setItem('byakuya_booted', 'true');
      const bootScreen = document.getElementById('boot-screen');
      const mainContent = document.getElementById('main-content');
      
      bootScreen.style.opacity = '0';
      bootScreen.style.visibility = 'hidden';
      mainContent.classList.add('visible');
    }

    window.addEventListener('DOMContentLoaded', runBootSequence);
  </script>
</body>
</html>
