<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B09"/>
      <stop offset="50%" stop-color="#101612"/>
      <stop offset="100%" stop-color="#040605"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 245, 138, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="url(#bg)"/>
  <rect width="800" height="350" fill="url(#grid)"/>

  <!-- Outer Cyber Rings -->
  <circle cx="400" cy="140" r="100" fill="none" stroke="rgba(0, 245, 138, 0.2)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="400" cy="140" r="80" fill="rgba(0, 245, 138, 0.02)" stroke="#00F58A" stroke-width="1" opacity="0.6"/>

  <!-- Fox Silhouette Logo -->
  <g transform="translate(400, 140)" filter="url(#glow)">
    <!-- Shield / Diamond Back -->
    <polygon points="0,-65 50,-20 50,35 0,65 -50,35 -50,-20" fill="#101612" stroke="#00F58A" stroke-width="2"/>
    
    <!-- Fox Head Silhouette -->
    <!-- Ears -->
    <polygon points="-35,-45 -20,-15 -5,-25" fill="#00F58A"/>
    <polygon points="35,-45 20,-15 5,-25" fill="#00F58A"/>
    <polygon points="-28,-38 -18,-18 -10,-23" fill="#080B09"/>
    <polygon points="28,-38 18,-18 10,-23" fill="#080B09"/>

    <!-- Face Outer -->
    <polygon points="0,-25 -35,-5 -22,25 0,45 22,25 35,-5" fill="#00F58A"/>

    <!-- Eyes (Dark Cutouts) -->
    <polygon points="-18,-2 -6,-2 -12,6" fill="#080B09"/>
    <polygon points="18,-2 6,-2 12,6" fill="#080B09"/>
    <polygon points="-14,0 -8,0 -11,3" fill="#78FFC0"/>
    <polygon points="14,0 8,0 11,3" fill="#78FFC0"/>

    <!-- Nose / Muzzle Cutout -->
    <polygon points="0,18 -8,6 8,6" fill="#080B09"/>
    <circle cx="0" cy="38" r="3" fill="#080B09"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="260" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#E8F5EC" text-anchor="middle" letter-spacing="4" filter="url(#glow)">BYAKUYATOOLS</text>
  <text x="400" y="288" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00F58A" text-anchor="middle" letter-spacing="3" opacity="0.8">CYBER SECURITY CONTROL PORTAL</text>
</svg>
