<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e"/>
      <stop offset="50%" stop-color="#0a121d"/>
      <stop offset="100%" stop-color="#04070c"/>
    </linearGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 255, 102, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg-grad)"/>
  <rect width="800" height="400" fill="url(#grid)"/>

  <!-- Cyber Circles & Glow Effects -->
  <circle cx="400" cy="180" r="120" fill="none" stroke="url(#neon-grad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="400" cy="180" r="90" fill="rgba(0, 255, 102, 0.03)" stroke="rgba(0, 255, 102, 0.3)" stroke-width="2"/>

  <!-- Key & Shield Icon Center -->
  <g transform="translate(400, 160)" filter="url(#glow)">
    <path d="M 0 -50 L 35 -30 L 35 15 C 35 40 0 55 0 55 C 0 55 -35 40 -35 15 L -35 -30 Z" fill="rgba(12, 19, 32, 0.9)" stroke="#00ff66" stroke-width="3"/>
    <path d="M -10 -10 C -10 -18 0 -22 10 -15 C 18 -8 15 5 5 10 L 12 25 L 5 25 L 0 20 L -3 25 L -10 25 L -5 12 C -8 7 -10 0 -10 -10 Z" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Cyber Tech Lines -->
  <path d="M 50 200 L 250 200 L 290 160" stroke="#00ff66" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="50" cy="200" r="4" fill="#00ff66"/>
  <path d="M 750 200 L 550 200 L 510 240" stroke="#00f0ff" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="750" cy="200" r="4" fill="#00f0ff"/>

  <!-- Text -->
  <text x="400" y="295" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#glow)">LINE-TOOLS</text>
  <text x="400" y="325" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#00ff66" text-anchor="middle" letter-spacing="6" opacity="0.9">AUTHTOKEN SYSTEM PORTAL</text>
</svg>
